name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "TopKselection/**"
      - "dashboard/**"
      - ".github/workflows/docker-build.yml"

env:
  PYTHON_VERSION: "3.10"
  DOCKER_REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME || 'smart-ecommerce' }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: preprocessing
            context: .
            dockerfile: docker/preprocessing/Dockerfile
          - name: scoring
            context: .
            dockerfile: docker/scoring/Dockerfile
          - name: supervised
            context: .
            dockerfile: docker/supervised/Dockerfile
          - name: clustering
            context: .
            dockerfile: docker/clustering/Dockerfile
          - name: association
            context: .
            dockerfile: docker/association/Dockerfile
          - name: dashboard
            context: .
            dockerfile: docker/dashboard/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && secrets.DOCKER_USERNAME && secrets.DOCKER_TOKEN
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and export Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.ref == 'refs/heads/main' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image (smoke test)
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:latest"
          echo "Test de l'image: $IMAGE_TAG"
          docker run --rm "$IMAGE_TAG" python --version
          echo "Image ${{ matrix.service.name }} OK"

  build-all-images:
    runs-on: ubuntu-latest
    needs: build-images
    if: always() && !failure() && !cancelled()
    steps:
      - name: All images built successfully
        run: echo "Les 6 images Docker ont ete construites avec succes"
